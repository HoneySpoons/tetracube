<script type="module">
import * as THREE from 'three';

// ── The board ────────────────────────────────────────────────────────────────
// Four faces, each W wide. A face's last column IS the next face's first column,
// so the tower is a ring of 4·(W−1) columns. Rows above H are the spawn zone.
const W = 10, H = 16, HT = H + 4, S = W - 1, RING = 4 * S;
const FACE_KEYS = ['a', 's', 'd', 'f'];
const FACE_COLORS = [0x4cc9f0, 0xf72585, 0x90be6d, 0xf9c74f];

const SHAPES = {               // [x, y], y up
  I: [[0, 2], [1, 2], [2, 2], [3, 2]],
  O: [[1, 1], [2, 1], [1, 2], [2, 2]],
  T: [[0, 1], [1, 1], [2, 1], [1, 2]],
  S: [[0, 1], [1, 1], [1, 2], [2, 2]],
  Z: [[1, 1], [2, 1], [0, 2], [1, 2]],
  J: [[0, 1], [1, 1], [2, 1], [0, 2]],
  L: [[0, 1], [1, 1], [2, 1], [2, 2]],
};
const CENTER = { I: 1.5, O: 1.5 };
const PIECE_COLORS = { I: 0x00d8ff, O: 0xffd60a, T: 0xb15cff, S: 0x38e07b, Z: 0xff4d6d, J: 0x3a86ff, L: 0xff9f1c };
const KICKS = [[0, 0], [-1, 0], [1, 0], [-2, 0], [2, 0], [0, 1], [0, -1]];

const ringCol = (f, j) => (f * S + j) % RING;

function rotCells(type, rot) {
  const c = CENTER[type] ?? 1;
  let cs = SHAPES[type].map(a => a.slice());
  for (let i = 0; i < ((rot % 4) + 4) % 4; i++) cs = cs.map(([x, y]) => [c + (y - c), c - (x - c)]);
  return cs;
}
const cellsOf = p => rotCells(p.type, p.rot).map(([x, y]) => [p.x + x, p.y + y]);

// ── State ────────────────────────────────────────────────────────────────────
let grid, actives, bags, lastDrop, active, score, lines, live, paused, over, flash;
// A run is ranked LIVE only if live mode was on before the first lock and never turned off.
let locks = 0, rankedLive = false, runStart = 0;
let armed = false;          // the pause menu's RESTART takes two taps; this is the first
let menu = null;            // an open pause sub-menu: null | 'audio'
const navPos = { pause: 0, audio: 0, over: 0, boards: 0 };   // the menu cursor per screen; the pause one survives a reopen
let overAt = 0;             // when the game-over screen opened: a Space held through the last drop can't start a new game
let streak = [], cubes = 0; // faces in the current TETRA streak, in order; TETRACUBEs this run
const runMode = () => rankedLive ? 'live' : 'focus';

function reset() {
  fx.wipe();
  grid = Array.from({ length: RING }, () => Array(HT).fill(null));
  actives = [null, null, null, null];
  bags = [[], [], [], []];
  lastDrop = [0, 0, 0, 0];
  active = 0; score = 0; lines = 0; live = false; paused = false; over = false; flash = ''; newHi = false;
  locks = 0; rankedLive = false; runStart = performance.now(); ov = null; armed = false; menu = null; streak = []; cubes = 0; renderOverlay();
  for (let f = 0; f < 4; f++) spawn(f);
  setActive(0, true);
  sfx.sync();
}

function peekType(f) { refill(f); return bags[f][bags[f].length - 1]; }
function nextType(f) { refill(f); return bags[f].pop(); }
function refill(f) {
  if (!bags[f].length) {
    bags[f] = Object.keys(SHAPES);
    for (let i = bags[f].length - 1; i > 0; i--) {
      const k = Math.floor(Math.random() * (i + 1));
      [bags[f][i], bags[f][k]] = [bags[f][k], bags[f][i]];
    }
  }
}

function collides(f, cells) {
  for (const [j, r] of cells) {
    if (j < 0 || j >= W || r < 0 || r >= HT) return true;
    const c = ringCol(f, j);
    if (grid[c][r]) return true;
    for (let g = 0; g < 4; g++) {                 // another face's falling piece on a shared corner
      if (g === f || !actives[g]) continue;
      for (const [gj, gr] of cellsOf(actives[g])) if (gr === r && ringCol(g, gj) === c) return true;
    }
  }
  return false;
}

function spawn(f) {
  const type = nextType(f);
  const p = { type, rot: 0, x: 3, y: H - 1 };
  actives[f] = null;
  if (collides(f, cellsOf(p))) { gameOver(); return; }
  actives[f] = p;
}

function tryMove(f, dx, dy, drot = 0) {
  const p = actives[f]; if (!p) return false;
  const kicks = drot ? KICKS : [[0, 0]];
  for (const [kx, ky] of kicks) {
    const q = { ...p, x: p.x + dx + kx, y: p.y + dy + ky, rot: p.rot + drot };
    if (!collides(f, cellsOf(q))) { actives[f] = q; return true; }
  }
  return false;
}

function lock(f) {
  const p = actives[f]; if (!p) return;
  actives[f] = null;
  let toppedOut = false;
  for (const [j, r] of cellsOf(p)) { grid[ringCol(f, j)][r] = p.type; if (r >= H) toppedOut = true; }
  fx.lock(f, p);
  locks++;
  clearRows();
  if (toppedOut) { gameOver(); return; }
  spawn(f);
}

// TETRA: one face clears four or more rows in a single wave.
// TETRACUBE: four TETRAs back to back, each on a different face, with no other clear in between.
// Waves are judged one at a time, in order; the clears inside one wave happen together:
//  1. any face clearing 1–3 rows in the wave breaks the streak (empties it) before this wave's TETRAs count;
//  2. each TETRA in the wave, by face index: on a face not yet in the streak it extends it; on a face
//     already in it, the streak breaks and this TETRA starts a new one;
//  3. the fourth distinct face makes a TETRACUBE: the bonus is added, the moment plays, the streak empties.
// A cascade wave counts like any other: a TETRA that falls out of a cascade extends the streak, and a
// cascade that clears 1–3 rows breaks it. Pieces that lock without a clear leave the streak alone.
// Focus and Live alike. The bonus is four TETRAs' worth at the current level.
const TETRA = 4, CUBE_BONUS = 4 * 800;
function tetraStreak(perFace) {
  if (perFace.some(k => k > 0 && k < TETRA)) streak = [];
  for (let g = 0; g < 4; g++) {
    if (perFace[g] < TETRA) continue;
    streak = streak.includes(g) ? [g] : [...streak, g];
    if (streak.length === 4) { streak = []; cubes++; score += CUBE_BONUS * level(); fx.cube(); }
  }
}

// A full row on one face removes its W cells — including the two corner cells,
// which belong to the neighbouring faces too. Their columns drop, which can
// complete *their* rows. Repeat until nothing clears: that's a cascade.
function clearRows() {
  for (let wave = 0; ; wave++) {
    const remove = new Map();                       // column → Map(row → face that cleared it)
    const perFace = [0, 0, 0, 0];
    let n = 0;
    for (let g = 0; g < 4; g++) for (let r = 0; r < HT; r++) {
      let full = true;
      for (let j = 0; j < W && full; j++) if (!grid[ringCol(g, j)][r]) full = false;
      if (!full) continue;
      n++; perFace[g]++;
      for (let j = 0; j < W; j++) {
        const c = ringCol(g, j);
        if (!remove.has(c)) remove.set(c, new Map());
        if (!remove.get(c).has(r)) remove.get(c).set(r, g);
      }
    }
    if (!n) return;
    const gone = [];
    for (const [c, rows] of remove) {
      for (const [r, g] of rows) gone.push({ c, r, g, type: grid[c][r] });
      [...rows.keys()].sort((a, b) => b - a).forEach(r => { grid[c].splice(r, 1); grid[c].push(null); });
    }
    const lvBefore = level();
    lines += n;
    const base = [0, 100, 300, 500, 800][Math.min(n, 4)] + Math.max(0, n - 4) * 400;
    score += base * level() * (wave + 1);
    fx.clear(gone, wave, n, perFace.some(k => k >= TETRA));
    if (level() > lvBefore) fx.levelUp();
    tetraStreak(perFace);
    for (let g = 0; g < 4; g++) {                    // a shifted corner may now sit inside a falling piece
      const p = actives[g];
      while (p && collides(g, cellsOf(p)) && p.y < HT) p.y++;
    }
  }
}

const level = () => 1 + Math.floor(lines / 10);
const interval = () => Math.max(90, 800 - (level() - 1) * 65);

let hi = +(localStorage.getItem('tetracube.hi') || 0), newHi = false;
function gameOver() {
  if (over) return; over = true;
  newHi = score > hi;
  if (newHi) { hi = score; localStorage.setItem('tetracube.hi', hi); }
  fx.over(); sfx.sync();
  overAt = performance.now(); navPos.over = 0;
  if (score <= 0) { ov = { kind: 'over', stage: 'board', mode: runMode(), board: null }; renderOverlay(); return; }
  const mine = ov = {
    kind: 'over', stage: 'loading', mode: runMode(), board: null, rank: null, err: '', top: false, cube: cubes > 0,
    initials: (localStorage.getItem('tetracube.initials') || 'AAA').split(''), cursor: 0,
    run: { score, lines, level: level(), mode: runMode(), durationMs: Math.round(performance.now() - runStart) },
  };
  renderOverlay();
  fetchBoard(mine.mode).then(b => {
    if (ov !== mine) return;
    mine.board = b;
    mine.top = b.length < 10 || score > b[b.length - 1].score;
    mine.stage = mine.top || mine.cube ? 'entry' : 'board';     // one initials entry covers the board and the hall of fame
    renderOverlay();
  }).catch(() => { if (ov === mine) { mine.stage = mine.cube ? 'entry' : 'offline'; renderOverlay(); } });
}

// ── Input ────────────────────────────────────────────────────────────────────
addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  sfx.init();
  if (ov?.stage === 'entry') { e.preventDefault(); entryKey(e.key); return; }
  if (k === 'm') { banner(sfx.toggle() ? 'SOUND OFF' : 'SOUND ON', 0, 0xffffff); if (msg.classList.contains('on')) renderOverlay(); return; }
  if (k === 'h' && !over) { toggleBoards(); return; }
  if (navKey(e, k)) return;
  if (ov?.kind === 'boards') { if (k === 'Escape' || k === 'p' || k === 'h') toggleBoards(); return; }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'r') { reset(); return; }
  if (over) return;
  if (k === 'p' || k === 'Escape') { togglePause(); return; }
  if (paused) return;
  const fi = FACE_KEYS.indexOf(k);
  if (fi >= 0) { setActive(fi); return; }
  if (k === 'l') { toggleLive(); return; }
  const f = active;
  if (k === 'ArrowLeft') { if (tryMove(f, -1, 0)) sfx.move(); }
  else if (k === 'ArrowRight') { if (tryMove(f, 1, 0)) sfx.move(); }
  else if (k === 'ArrowDown') { if (tryMove(f, 0, -1)) { score += 1; sfx.soft(); } else lock(f); lastDrop[f] = performance.now(); }
  else if (k === 'ArrowUp' || k === 'x') { if (tryMove(f, 0, 0, 1)) sfx.rotate(); }
  else if (k === 'z') { if (tryMove(f, 0, 0, -1)) sfx.rotate(); }
  else if (k === ' ') hardDrop();
});

function hardDrop() {
  const f = active, from = actives[f]; if (!from) return;
  let d = 0; while (tryMove(f, 0, -1)) d++;
  fx.hardDrop(f, from, actives[f], d);
  score += 2 * d; lock(f); lastDrop[f] = performance.now();
}
function toggleLive() {
  live = !live; lastDrop = lastDrop.map(() => performance.now());
  rankedLive = live && locks === 0;
}
function togglePause() {
  if (over || ov) return;
  paused = !paused; armed = false; menu = null;
  if (!paused) lastDrop = lastDrop.map(() => performance.now());
  renderOverlay(); sfx.sync();
}
const playable = () => !over && !paused && !ov;
// a background tab pauses: a game that keeps falling where nobody can see it is a bug players report
document.addEventListener('visibilitychange', () => { if (document.hidden && playable()) togglePause(); });

// ── Keyboard menus ───────────────────────────────────────────────────────────
// Every overlay is a list of [data-nav] items. ↑/↓ (W/S) move a cursor, Enter/Space press the item, Esc goes
// back a level (AUDIO → PAUSE → the game), ←/→ work a slider row. The cursor is virtual: DOM focus stays on
// #keytrap, so Vimium stays out and the mouse and touch paths are untouched. Tab still reaches the real buttons
// and the cursor follows it. The initials screen keeps its own keys (type, arrows, Enter, Esc).
const scr = () => ov?.kind === 'boards' ? 'boards' : over ? 'over' : menu === 'audio' ? 'audio' : 'pause';
const navItems = () => [...msg.querySelectorAll('[data-nav]')];
const navIdx = (items = navItems()) => Math.max(0, Math.min(items.length - 1, navPos[scr()] | 0));
let kbdSeen = false;                           // a touch device shows the cursor once a key has moved it
function applyNav() {
  const items = navItems();
  if (!items.length || (document.body.classList.contains('touch') && !kbdSeen)) return;
  const i = navIdx(items);
  navPos[scr()] = i;
  items.forEach((el, k) => el.classList.toggle('focus', k === i));
}
function moveNav(d) {
  const items = navItems(); if (!items.length) return;
  navPos[scr()] = (navIdx(items) + d + items.length) % items.length;
  applyNav(); sfx.move();
  if (trap) trap();
}
function activate(el) {
  if (!el || el.dataset.k) return;             // a slider row changes with ←/→, not Enter
  el.click();                                  // the same path as a tap: the click listener → onAct, or the link opens
  if (trap) trap();
}
function navKey(e, k) {
  if (!msg.classList.contains('on') || ov?.stage === 'entry') return false;
  const items = navItems(); if (!items.length) return false;
  if (k === 'ArrowDown' || k === 's' || k === 'ArrowUp' || k === 'w') { e.preventDefault(); kbdSeen = true; moveNav(k === 'ArrowDown' || k === 's' ? 1 : -1); return true; }
  const el = items[navIdx(items)];
  if ((k === 'ArrowLeft' || k === 'ArrowRight') && el.dataset.k) { e.preventDefault(); kbdSeen = true; sfx.set(el.dataset.k, audio[el.dataset.k] + (k === 'ArrowRight' ? 1 : -1)); return true; }
  if (k === 'Enter' || k === ' ') {
    e.preventDefault();
    if (over && performance.now() - overAt < 700) return true;
    activate(el); return true;
  }
  if (k === 'Escape' && menu === 'audio') { closeAudio(); return true; }
  return false;
}
function closeAudio() { menu = null; renderOverlay(); }

// Keyboard extensions (Vimium: F = link hints, D = scroll) leave the page alone
// while a text field has focus, so on desktop a hidden one keeps it.
const keytrap = document.getElementById('keytrap'), msg = document.getElementById('msg');
let trap = null;                               // desktop only; touch has no trap (no on-screen keyboard)
if (!document.body.classList.contains('touch') && !matchMedia('(pointer: coarse)').matches) {
  trap = () => { if (document.activeElement !== keytrap) keytrap.focus({ preventScroll: true }); };
  // refocus only when focus fell to nothing, so Tab can still reach the overlay's links and buttons
  keytrap.addEventListener('blur', () => setTimeout(() => {
    if (!document.activeElement || document.activeElement === document.body) trap();
  }, 0));
  keytrap.addEventListener('input', () => { keytrap.value = ''; });
  addEventListener('mousedown', e => { if (!(e.target instanceof Element && e.target.closest('a, button'))) setTimeout(trap, 0); });
  trap();
}

// ── Touch: swipe to move, tap to rotate, flick down to drop ─────────────────
if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');
let tp = null;
const STEP = () => Math.max(22, Math.min(40, innerWidth / 14));
addEventListener('pointerdown', e => {
  sfx.init();
  if (e.pointerType === 'mouse' || (e.target instanceof Element && e.target.closest('button, a, #msg .panel, #net'))) return;
  tp = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false };
});
addEventListener('pointermove', e => {
  if (!tp || e.pointerId !== tp.id || !playable()) return;
  const s = STEP(), f = active;
  while (e.clientX - tp.lx >= s) { tp.lx += s; tp.moved = true; if (tryMove(f, 1, 0)) sfx.move(); }
  while (tp.lx - e.clientX >= s) { tp.lx -= s; tp.moved = true; if (tryMove(f, -1, 0)) sfx.move(); }
  while (e.clientY - tp.ly >= s * 1.3) {
    tp.ly += s * 1.3; tp.moved = true;
    if (tryMove(f, 0, -1)) { score += 1; sfx.soft(); lastDrop[f] = performance.now(); }
  }
  if (tp.ly - e.clientY > s) tp.ly = e.clientY;          // upward drift doesn't bank soft drops
});
addEventListener('pointerup', e => {
  if (!tp || e.pointerId !== tp.id) return;
  const t = tp, dt = performance.now() - t.t0, dx = e.clientX - t.x0, dy = e.clientY - t.y0;
  tp = null;
  if (!playable()) return;
  const vertical = Math.abs(dy) > 2 * Math.abs(dx);
  if (vertical && dy > 70 && dt < 260) hardDrop();
  else if (vertical && dy < -60 && dt < 300) { if (tryMove(active, 0, 0, -1)) sfx.rotate(); }
  else if (!t.moved && dt < 300) { if (tryMove(active, 0, 0, 1)) sfx.rotate(); }
});
addEventListener('pointercancel', () => { tp = null; });

// iOS Safari ignores user-scalable=no / maximum-scale, so on this page a double tap zoomed in and a
// pinch did too, with no way back out mid-game. Game page only: /scores and /about stay zoomable.
// touch-action (CSS above) covers most of it; these cover what iOS still lets through.
if (matchMedia('(pointer: coarse)').matches) {
  const stop = e => e.preventDefault();
  for (const t of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']) document.addEventListener(t, stop, { passive: false });
  let lastEnd = 0;                               // a second touchend inside 300 ms is a double tap: cancel its zoom,
  document.addEventListener('touchend', e => {   // except on buttons and links, which must still click
    const now = e.timeStamp;
    if (now - lastEnd < 300 && !(e.target instanceof Element && e.target.closest('button, a, input'))) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // and if a zoom gets through anyway, re-assert the viewport, which makes iOS snap back to 1×
  const vm = document.querySelector('meta[name=viewport]'), vmContent = vm.content;
  visualViewport?.addEventListener('resize', () => {
    if (visualViewport.scale <= 1.01) return;
    vm.content = vmContent + ',minimum-scale=1';
    requestAnimationFrame(() => { vm.content = vmContent; });
  });
}

// every on-screen button routes through here
addEventListener('click', e => {
  if (e.target === net) return;               // the net picks faces on pointerup, below
  if (trap && e.detail > 0 && e.target instanceof Element && e.target.closest('#msg a')) { trap(); return; }   // links open a new tab
  const b = e.target instanceof Element && e.target.closest('[data-act]'); if (!b) return;
  sfx.init();
  const act = b.dataset.act, i = +b.dataset.i;
  onAct(act, i, b);
  // Hand focus back to the trap: the pressed button is usually gone (re-rendered), and a button
  // that survives (ESC MENU) would leave Vimium the keys. A keyboard press lands on the menu
  // cursor, which stays on RESTART through CONFIRM?, so a second Enter confirms.
  if (!trap) return;
  const a = document.activeElement;
  if (e.detail > 0 || !a || a === document.body || !a.isConnected) trap();
});
// the cursor follows Tab (real focus) and the mouse, so a click and an Enter always agree
msg.addEventListener('focusin', e => { const i = navItems().indexOf(e.target); if (i >= 0) { navPos[scr()] = i; applyNav(); } });
msg.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const el = e.target instanceof Element && e.target.closest('[data-nav]'), i = el ? navItems().indexOf(el) : -1;
  if (i >= 0 && i !== navIdx()) { navPos[scr()] = i; applyNav(); }
});
// the AUDIO sliders: tap or drag anywhere on the bar (the n-th cell lights n cells; left of the bar is 0)
let slDrag = null;
const slAt = (sl, x) => { const r = sl.getBoundingClientRect(); sfx.set(sl.dataset.k, Math.ceil((x - r.left) / r.width * 10)); };
msg.addEventListener('pointerdown', e => {
  const sl = e.target instanceof Element && e.target.closest('.sl'); if (!sl) return;
  e.preventDefault(); slDrag = { k: sl.dataset.k, id: e.pointerId }; slAt(sl, e.clientX);
});
addEventListener('pointermove', e => { if (slDrag && e.pointerId === slDrag.id) { const sl = msg.querySelector(`.sl[data-k="${slDrag.k}"]`); if (sl) slAt(sl, e.clientX); } });
addEventListener('pointerup', e => { if (slDrag?.id === e.pointerId) slDrag = null; });
addEventListener('pointercancel', () => { slDrag = null; });
function onAct(act, i, b) {
  if (act === 'face' && playable()) setActive(+b.dataset.f);
  else if (act === 'live' && playable()) toggleLive();
  else if (act === 'pause' || act === 'resume') togglePause();
  else if (act === 'again') reset();
  else if (act === 'restart' && paused && !ov) { if (armed) reset(); else { armed = true; sfx.rotate(); renderOverlay(); } }
  else if (act === 'audio' && paused && !ov) { armed = false; menu = 'audio'; navPos.audio = 0; renderOverlay(); }
  else if (act === 'back') closeAudio();
  else if (act === 'vol') sfx.set(b.dataset.k, audio[b.dataset.k] + +b.dataset.d);
  else if (act === 'mute') { sfx.toggle(); renderOverlay(); }
  else if (act === 'boards') toggleBoards();
  else if (ov?.stage === 'entry') {
    if (act === 'up' || act === 'down') {
      ov.cursor = i;
      const k = ALPHA.indexOf(ov.initials[i]), d = act === 'up' ? 1 : -1;
      ov.initials[i] = ALPHA[(k + d + ALPHA.length) % ALPHA.length]; sfx.rotate(); renderOverlay();
    }
    else if (act === 'save') submit(ov);
    else if (act === 'skip') { ov.stage = 'board'; renderOverlay(); }
  }
}

// ── Scene ────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);

const camera = new THREE.OrthographicCamera();
camera.position.set(40, 40, 40);                    // true isometric
camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(-10, 30, 25);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.55);
fill.position.set(30, 10, -5);
scene.add(fill);

const tower = new THREE.Group();
tower.position.y = 1.5;
scene.add(tower);

const Y0 = -H / 2;                                   // world y of row 0's bottom
// world (x, z) of a ring column: face 0 is +z, faces go counter-clockwise seen from above
function colXZ(c) {
  const f = Math.floor(c / S), j = c % S;
  const [x, z] = [[j, S], [S, S - j], [S - j, 0], [0, j]][f];
  return [x - S / 2, z - S / 2];
}

const core = new THREE.Mesh(new THREE.BoxGeometry(W - 2, H, W - 2),
  new THREE.MeshLambertMaterial({ color: 0x161c27 }));
tower.add(core);

// grid + frame per face, built for face 0 then turned into place
const faceLines = [];
for (let f = 0; f < 4; f++) {
  const pts = [], z = W / 2 + 0.005;
  for (let j = 0; j <= W; j++) pts.push(j - W / 2, Y0, z, j - W / 2, Y0 + H, z);
  for (let r = 0; r <= H; r++) pts.push(-W / 2, Y0 + r, z, W / 2, Y0 + r, z);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const m = new THREE.LineBasicMaterial({ color: FACE_COLORS[f], transparent: true, opacity: 0.08 });
  const lines = new THREE.LineSegments(g, m);
  lines.rotation.y = f * Math.PI / 2;
  tower.add(lines);
  faceLines.push(lines);
}

const box = new THREE.BoxGeometry(0.94, 0.94, 0.94);
const solid = new THREE.InstancedMesh(box, new THREE.MeshLambertMaterial(), RING * HT + 64);
const ghost = new THREE.InstancedMesh(box,
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.22, depthWrite: false }), 16);
tower.add(solid, ghost);
const m4 = new THREE.Matrix4(), col = new THREE.Color();

function place(mesh, i, c, r, hex) {
  const [x, z] = colXZ(c);
  m4.makeTranslation(x, Y0 + r + 0.5, z);
  mesh.setMatrixAt(i, m4);
  mesh.setColorAt(i, col.setHex(hex));
}

function drawTower() {
  let n = 0;
  for (let c = 0; c < RING; c++) for (let r = 0; r < HT; r++) {
    const t = grid[c][r]; if (!t) continue;
    const age = performance.now() - (lockGlow.get(c * HT + r) ?? -1e9);
    place(solid, n++, c, r, PIECE_COLORS[t]);
    if (age < 220) solid.setColorAt(n - 1, col.setHex(PIECE_COLORS[t]).lerp(WHITE, 0.75 * (1 - age / 220)));
  }
  for (let f = 0; f < 4; f++) {
    const p = actives[f]; if (!p) continue;
    for (const [j, r] of cellsOf(p)) place(solid, n++, ringCol(f, j), r, PIECE_COLORS[p.type]);
  }
  solid.count = n;
  solid.instanceMatrix.needsUpdate = true;
  if (solid.instanceColor) solid.instanceColor.needsUpdate = true;

  let g = 0;
  const p = actives[active];
  if (p && !over) {
    let q = { ...p };
    while (!collides(active, cellsOf({ ...q, y: q.y - 1 }))) q.y--;
    if (q.y !== p.y) for (const [j, r] of cellsOf(q)) place(ghost, g++, ringCol(active, j), r, PIECE_COLORS[p.type]);
  }
  ghost.count = g;
  ghost.instanceMatrix.needsUpdate = true;
  if (ghost.instanceColor) ghost.instanceColor.needsUpdate = true;

  faceLines.forEach((l, f) => { l.material.opacity = f === active ? 0.45 + 0.5 * faceFlash : 0.07; });
  edges.material.opacity = 0.1 + 0.9 * edgeGlow;
}

// turn the tower so the chosen face is front-left; its right neighbour is front-right
let rotTarget = 0, rotSpring = 0, rotVel = 0, faceFlash = 0;   // rotSpring chases rotTarget
function setActive(f, snap = false) {
  active = f;
  lastDrop[f] = performance.now();
  const want = -f * Math.PI / 2;
  let d = want - rotTarget;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  rotTarget += d;
  if (snap) { tower.rotation.y = rotSpring = rotTarget; rotVel = 0; }
  else if (d) { sfx.swoosh(d); if (!calm()) faceFlash = 1; }
}

const isCompact = () => innerWidth <= 760 || (matchMedia('(pointer: coarse)').matches && innerWidth <= 1180);
function resize() {
  renderer.setSize(innerWidth, innerHeight);
  const a = innerWidth / innerHeight;
  // the net: as large as fits between the corner buttons, never larger than 1:1
  const netW = 4 * W * CELL + 3 * GAP, reserve = document.body.classList.contains('touch') ? 190 : 40;
  document.documentElement.style.setProperty('--ns', Math.max(0.5, Math.min(1, (innerWidth - reserve) / netW)).toFixed(3));
  let half, y;
  if (isCompact()) {
    // Iso projection of the tower (spawn zone included): 24.5 units tall, 14.1 wide.
    // Fit it into the band between the score bar and the net, measured from the page.
    const top = Math.max(document.getElementById('hud').getBoundingClientRect().bottom, 0) + 10;
    const bottom = net.getBoundingClientRect().top - 10;
    const band = Math.max(120, bottom - top);
    half = Math.max(26 * innerHeight / (2 * band), 8.4 / a);
    const upUnits = (innerHeight / 2 - (top + band / 2)) * (2 * half / innerHeight);
    y = (upUnits * Math.sqrt(6) - 4) / 2;                   // tower centre on screen = (4 + 2y)/√6
  } else {
    const room = innerWidth / 2 - 250;                     // px between centre and the HUD column
    half = Math.max(17.5, room > 0 ? 7.8 * innerHeight / (2 * room) : 40);
    y = 1.5;
  }
  tower.position.y = y;
  Object.assign(camera, { left: -half * a, right: half * a, top: half, bottom: -half, near: -200, far: 200 });
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
screen.orientation?.addEventListener?.('change', () => setTimeout(resize, 50));   // fold / unfold / rotate
document.fonts?.ready.then(resize);                                               // the HUD's height depends on the font

// ── Sound: everything synthesised, nothing to load ──────────────────────────
// Three settings, kept in localStorage: SFX 0–10, MUSIC 0–10 and MUTE ALL (the M key). The graph is
// voices → sfx bus | music bus (behind a duck) → master → out; mute is master at 0, so the voices never
// have to know. The context is made on the first key, tap or click (the autoplay rule), and a refusal
// (no device, headless) means silence, never an error.
const AUDIO_KEY = 'tetracube.audio';
const audio = { sfx: 10, music: 6, mute: false };
try {
  const saved = JSON.parse(localStorage.getItem(AUDIO_KEY) || '{}');
  for (const k of ['sfx', 'music']) if (Number.isFinite(+saved[k])) audio[k] = Math.max(0, Math.min(10, Math.round(+saved[k])));
  if (typeof saved.mute === 'boolean') audio.mute = saved.mute;
} catch {}
const sfx = (() => {
  let ctx, master, bus, musicBus, duckG, noiseBuf;
  const st = (base, n) => base * Math.pow(2, n / 12);

    nx.fillStyle = f === active ? hex(FACE_COLORS[f]) : '#6b7686';
    nx.font = '8px "Press Start 2P", monospace'; nx.textAlign = 'center';
    nx.fillText(FACE_KEYS[f].toUpperCase(), ox + W * CELL / 2, H * CELL + 14);
  }
}

// ── HUD ──────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const pad = (n, w) => String(n).padStart(w, '0');
$('title').innerHTML = [...'TETRACUBE'].map((ch, i) =>
  `<span style="color:${hex(Object.values(PIECE_COLORS)[i % 7])}">${ch}</span>`).join('');
const nextCtx = $('next').getContext('2d');
let hudKey = '';
function drawBlock(ctx, x, y, s, color) {        // NES-style block: flat face, light corner, dark edge
  ctx.fillStyle = color; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x + 1, y + 1, 2, 2);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x, y + s - 2, s, 2); ctx.fillRect(x + s - 2, y, 2, s);
}
function drawHud() {
  const nt = over ? '' : peekType(active);
  const key = [score, hi, lines, level(), live, rankedLive, nt, over, active].join('|');
  if (key === hudKey) return;
  hudKey = key;
  $('score').textContent = pad(score, 6);
  $('top').textContent = pad(Math.max(hi, score), 6);
  $('lines').textContent = pad(lines, 3);
  $('level').textContent = pad(level(), 2);
  $('mode').innerHTML = (live ? '<span style="color:#ff4d6d">LIVE</span><br>ALL FOUR FALL' : '<span style="color:#38e07b">FOCUS</span><br>ONE FACE FALLS') +
    `<br><span style="color:var(--dim)">BOARD: ${runMode().toUpperCase()}</span>` +
    (locks === 0 && !live ? '<br><span style="color:var(--dim)">L NOW FOR LIVE</span>' : '');
  $('tb-live').classList.toggle('on', live);
  nextCtx.clearRect(0, 0, 64, 40);
  if (nt) {
    const cs = SHAPES[nt], xs = cs.map(c => c[0]), ys = cs.map(c => c[1]), B = 12;
    const w = (Math.max(...xs) - Math.min(...xs) + 1) * B, h = (Math.max(...ys) - Math.min(...ys) + 1) * B;
    for (const [x, y] of cs) drawBlock(nextCtx, (64 - w) / 2 + (x - Math.min(...xs)) * B, (40 - h) / 2 + (Math.max(...ys) - y) * B, B, hex(PIECE_COLORS[nt]));
  }
}

// ── Leaderboard ──────────────────────────────────────────────────────────────
const COFFEE_URL = 'https://buymeacoffee.com/HoneySpoons';
const API = '/api/scores', CUBE_API = '/api/cube', ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let ov = null;   // overlay: null | { kind: 'over', stage } | { kind: 'boards' }
async function fetchBoard(mode, limit = 10) {
  const r = await fetch(`${API}?mode=${mode}&limit=${limit}`);
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).scores;
}
function entryKey(key) {
  const o = ov, ch = key.length === 1 ? key.toUpperCase() : key;
  if (ALPHA.includes(ch) && ch.length === 1) { o.initials[o.cursor] = ch; o.cursor = Math.min(2, o.cursor + 1); sfx.move(); }
  else if (ch === 'Backspace' || ch === 'ArrowLeft') { o.cursor = Math.max(0, o.cursor - 1); sfx.move(); }
  else if (ch === 'ArrowRight') { o.cursor = Math.min(2, o.cursor + 1); sfx.move(); }
  else if (ch === 'ArrowUp' || ch === 'ArrowDown') {
    const i = ALPHA.indexOf(o.initials[o.cursor]), d = ch === 'ArrowUp' ? 1 : -1;
    o.initials[o.cursor] = ALPHA[(i + d + ALPHA.length) % ALPHA.length]; sfx.rotate();
  }
  else if (ch === 'Escape') { o.stage = 'board'; }
  else if (ch === 'Enter') { submit(o); return; }
  renderOverlay();
}
async function submit(o) {
  o.stage = 'sending'; o.err = ''; renderOverlay();
  const initials = o.initials.join('');
  // Each post settles on its own and never throws: a hall-of-fame failure (offline, 500, blocked)
  // can't take the score down with it, and the other way round.
  const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(async r => ({ r, body: await r.json().catch(() => ({})) }), () => ({ r: { ok: false, status: 0 }, body: {} }));
  try {
    const [s, c] = await Promise.all([o.top ? post(API, { initials, ...o.run }) : null, o.cube ? post(CUBE_API, { initials, ...o.run }) : null]);
    if (ov !== o) return;
    // both endpoints share one initials filter, so they refuse the same initials together
    if ([s, c].some(x => x && x.r.status === 400 && x.body.error === 'initials')) { o.stage = 'entry'; o.err = 'PICK OTHER INITIALS'; renderOverlay(); return; }
    localStorage.setItem('tetracube.initials', initials);
    if (c) { if (c.r.ok) o.place = c.body.place; else o.cubeErr = c.r.status === 429 ? 'HALL OF FAME BUSY — TRY LATER' : 'HALL OF FAME SAID NO'; }
    if (s && !s.r.ok) { o.stage = 'offline'; o.err = s.r.status === 429 ? 'TOO MANY SCORES — TRY LATER' : 'SCORE REJECTED'; renderOverlay(); return; }
    if (s) {
      o.rank = s.body.rank; o.mine = { initials, score: o.run.score };
      o.board = await fetchBoard(o.mode).catch(() => o.board);   // the score is saved; a failed refresh keeps the old board
      if (ov !== o) return;
    }
    o.stage = 'board'; sfx.level(); renderOverlay();
  } catch { if (ov === o) { o.stage = 'offline'; renderOverlay(); } }
}
function toggleBoards() {
  armed = false;
  if (ov?.kind === 'boards') {
    paused = ov.wasPaused; ov = null;
    if (!paused) lastDrop = lastDrop.map(() => performance.now());
    renderOverlay(); sfx.sync(); return;
  }
  const mine = ov = { kind: 'boards', focus: null, live: null, err: false, wasPaused: paused };
  paused = true; navPos.boards = 0; renderOverlay(); sfx.sync();
  Promise.all([fetchBoard('focus'), fetchBoard('live')])
    .then(([f, l]) => { if (ov === mine) { mine.focus = f; mine.live = l; renderOverlay(); } })
    .catch(() => { if (ov === mine) { mine.err = true; renderOverlay(); } });
}
const rainbow = t => [...t].map((ch, i) => ch === ' ' ? ' ' : `<span style="color:${hex(Object.values(PIECE_COLORS)[i % 7])}">${ch}</span>`).join('');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
function boardHtml(list, mine) {
  if (!list) return '<p style="color:var(--dim)">LOADING…</p>';
  let hit = false;
  const rows = Array.from({ length: 10 }, (_, i) => {
    const s = list[i];
    const me = s && mine && !hit && s.initials === mine.initials && s.score === mine.score;
    if (me) hit = true;
    const c = me ? ' class="me"' : i === 0 && s ? ' style="color:#ffd60a"' : '';
    return `<tr${c}><td>${pad(i + 1, 2)}</td><td>${s ? esc(s.initials) : '---'}</td><td>${s ? pad(Number(s.score) | 0, 6) : '------'}</td><td>${s ? pad(Number(s.level) | 0, 2) : '--'}</td></tr>`;
  }).join('');
  return `<table class="board"><tr class="h"><td>NO</td><td>NAME</td><td>SCORE</td><td>LV</td></tr>${rows}</table>`;
}
function controlsHtml() {
  const row = (label, keys) => `<div class="row">${label}<span>${keys}</span></div>`;
  const k = s => `<span class="k">${s}</span>`;
  if (document.body.classList.contains('touch')) return `<div class="ctl">` +
    row('MOVE', 'SWIPE &larr; &rarr;') + row('ROTATE', 'TAP') + row('ROTATE BACK', 'SWIPE &uarr;') +
    row('SOFT DROP', 'DRAG &darr;') + row('HARD DROP', 'FLICK &darr;') + row('FACE', 'TAP A BOARD BELOW') + `</div>`;
  return `<div class="ctl">` +
    row('FACE', k('A') + k('S') + k('D') + k('F')) + row('MOVE', k('&larr;') + k('&rarr;')) + row('SOFT DROP', k('&darr;')) +
    row('ROTATE', k('&uarr;') + k('X')) + row('ROTATE BACK', k('Z')) + row('HARD DROP', k('SPACE')) +
    row('LIVE MODE', k('L')) + row('HIGH SCORES', k('H')) + row('RESTART', k('R')) +
    row(soundState(), k('M')) + row('RESUME', k('ESC')) + `</div>`;
}
const soundState = () => 'SOUND ' + (audio.mute || (!audio.sfx && !audio.music) ? 'OFF' : audio.sfx && audio.music ? 'ON' : audio.sfx ? 'SFX ONLY' : 'MUSIC ONLY');
function audioHtml() {
  const slider = (k, label) => `<div class="arow" data-nav data-k="${k}"><span class="al">${label}</span>` +
    `<button class="btn" data-act="vol" data-k="${k}" data-d="-1">&lt;</button>` +
    `<span class="sl" data-k="${k}">${Array.from({ length: 10 }, (_, i) => `<i class="${i < audio[k] ? 'on' : ''}"></i>`).join('')}</span>` +
    `<button class="btn" data-act="vol" data-k="${k}" data-d="1">&gt;</button><span class="an">${pad(audio[k], 2)}</span></div>`;
  return `<div class="panel"><h1 style="color:#fff">AUDIO</h1>` + slider('sfx', 'SFX') + slider('music', 'MUSIC') +
    `<div class="btns menu"><button class="btn${audio.mute ? ' warn' : ''}" data-nav data-act="mute">MUTE ALL: ${audio.mute ? 'ON' : 'OFF'}</button>` +
    `<button class="btn go" data-nav data-act="back">BACK</button></div>` +
    `<p class="hint kbd">&uarr;&darr; PICK &nbsp; &larr;&rarr; ADJUST &nbsp; ESC BACK</p></div>`;
}
function renderOverlay() {
  drawOverlay();
  applyNav();
  if (trap && document.activeElement === document.body) trap();   // the focused button may have been replaced
}
function drawOverlay() {
  const on = !!ov || paused || over;
  msg.classList.toggle('on', on);
  if (!on) { msg.innerHTML = ''; return; }
  const LB = `<a class="btn" data-nav href="/scores" target="_blank" rel="noopener">LEADERBOARD &#8599;</a>`;
  const AGAIN = `<button class="btn go" data-nav data-act="again">PLAY AGAIN</button>`;
  if (ov?.kind === 'boards') {
    msg.innerHTML = `<div class="panel"><h1 style="color:#fff">HIGH SCORES</h1>` + (ov.err ? '<p>SCOREBOARD OFFLINE</p>' :
      `<div class="boards"><div><p class="bt" style="color:#38e07b">FOCUS</p>${boardHtml(ov.focus)}</div>` +
      `<div><p class="bt" style="color:#ff4d6d">LIVE</p>${boardHtml(ov.live)}</div></div>`) +
      `<div class="btns"><button class="btn go" data-nav data-act="boards">BACK TO GAME</button>${LB}</div></div>`;
    return;
  }
  if (!over) {
    if (menu === 'audio') { msg.innerHTML = audioHtml(); return; }
    msg.innerHTML = `<div class="panel"><h1 style="color:#fff">PAUSE</h1>` +
      `<div class="btns menu"><button class="btn go" data-nav data-act="resume">RESUME</button>${LB}` +
      (armed ? `<button class="btn warn" data-nav data-act="restart">CONFIRM?</button>` : `<button class="btn" data-nav data-act="restart">RESTART</button>`) +
      `<button class="btn" data-nav data-act="audio">AUDIO</button></div>` +
      controlsHtml() +
      (COFFEE_URL.startsWith('#') ? '' : `<a id="coin" data-nav href="${COFFEE_URL}" target="_blank" rel="noopener"><span class="c">INSERT COIN</span> &#9749;</a>`) +
      `<a id="about" data-nav href="/about" target="_blank" rel="noopener">ABOUT TETRACUBE &#8599;</a></div>`;
    return;
  }
  const o = ov ?? { stage: 'board', mode: runMode() };
  const head = `<h1>GAME OVER</h1><p>SCORE ${pad(score, 6)} &nbsp; LINES ${pad(lines, 3)}</p>` +
    (newHi ? `<p style="color:#ffd60a">NEW PERSONAL BEST!</p>` : '');
  let body = '';
  const hof = o.place ? `<p style="margin-top:14px">${rainbow(`TETRACUBE HALL OF FAME #${o.place}`)}</p>`
    : o.cubeErr ? `<p style="color:#ff4d6d;margin-top:14px">${o.cubeErr}</p>` : '';
  if (o.stage === 'loading' || o.stage === 'sending') body = `<p style="color:var(--dim)">${o.stage === 'loading' ? 'CHECKING THE BOARD…' : 'SENDING…'}</p>`;
  else if (o.stage === 'entry') body =
    (o.cube ? `<p style="margin-top:16px">${rainbow('YOU BUILT A TETRACUBE!')}</p><p style="color:var(--dim)">SIGN THE HALL OF FAME</p>` : '') +
    (o.top ? `<p style="color:#ffd60a;margin-top:16px">YOU MADE THE ${o.mode.toUpperCase()} TOP 10!</p>` : '') + `<p>ENTER YOUR INITIALS</p>` +
    `<div class="initials">${o.initials.map((ch, i) =>
      `<div class="ini"><button class="btn tch" data-act="up" data-i="${i}">&#9650;</button>` +
      `<span class="${i === o.cursor ? 'cur' : ''}">${esc(ch)}</span>` +
      `<button class="btn tch" data-act="down" data-i="${i}">&#9660;</button></div>`).join('')}</div>` +
    (o.err ? `<p style="color:#ff4d6d">${o.err}</p>` : '') +
    `<div class="btns"><button class="btn go" data-act="save">SAVE</button><button class="btn" data-act="skip">SKIP</button></div>` +
    `<p class="hint kbd">TYPE OR &uarr;&darr; &nbsp; ENTER TO SAVE &nbsp; ESC TO SKIP</p>`;
  else if (o.stage === 'offline') body = hof + `<p style="color:#ff4d6d;margin-top:14px">${o.err || 'SCOREBOARD OFFLINE'}</p><div class="btns">${AGAIN}</div>`;
  else if (!o.board) body = hof + `<div class="btns">${AGAIN}${LB}</div><p class="hint kbd">OR PRESS R</p>`;
  else body = hof + `<p class="bt" style="margin-top:14px;color:${o.mode === 'live' ? '#ff4d6d' : '#38e07b'}">${o.mode.toUpperCase()} TOP 10${o.rank ? ` · YOU'RE #${o.rank}` : ''}</p>` +
    (o.board ? boardHtml(o.board, o.mine) : '') + `<div class="btns">${AGAIN}${LB}</div><p class="hint kbd">OR PRESS R</p>`;
  msg.innerHTML = `<div class="panel">${head}${body}</div>`;
}

// ── Loop ─────────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused && !over) {
    for (let f = 0; f < 4; f++) {
      if (f !== active && !live) continue;
      const iv = f === active ? interval() : interval() * 2;
      if (now - lastDrop[f] >= iv) { lastDrop[f] = now; if (!tryMove(f, 0, -1)) lock(f); }
    }
  }
  rotVel += ((rotSpring - rotTarget) * -190 - rotVel * 21) * dt;         // a little overshoot
  rotSpring += rotVel * dt;
  const ct = calm() ? -1 : (now - cubeAt) / CUBE_MS;                    // TETRACUBE!: one extra turn, eased in and out, view only
  const su = (ct - SPIN[0]) / (SPIN[1] - SPIN[0]), spinning = su > 0 && su < 1;
  // constant speed with short ramps, not a smoothstep: a turn sweeps each falling piece past the same
  // pixels, so the peak speed sets the flash rate (4 pieces in ~1.75 s ≈ 2.3/s)
  const RA = 0.125, VM = 1 / (1 - RA);
  const spin = !spinning ? 0 : 2 * Math.PI * (su < RA ? VM * su * su / (2 * RA) : su < 1 - RA ? VM * (RA / 2 + su - RA) : 1 - VM * (1 - su) ** 2 / (2 * RA));
  tower.rotation.y = rotSpring + spin;
  faceFlash = Math.max(0, faceFlash - dt * 2.5);
  edgeGlow = Math.max(0, edgeGlow - dt * 1.2);
  shake = Math.max(0, shake - dt * 3);
  shakePh += dt * 2 * Math.PI * 2;                                       // one damped 2 Hz thump, never a strobe
  const so = 0.35 * shake * Math.sin(shakePh);
  camera.position.set(40 + so * shakeDir.x, 40 + so * shakeDir.y, 40 + so * shakeDir.z);
  bgPulse = Math.max(0, bgPulse - dt * 0.8);
  scene.background.setHex(0x0b0e14).lerp(col.setHex(FACE_COLORS[active]), 0.18 * bgPulse);
  fx.update(dt);
  drawTower();
  if (ct >= 0 && ct < SPIN[1]) faceLines.forEach(l => { l.material.opacity = 0.05; });   // around the spin, grid lines stay dim, or the turn sweeps them past every pixel like a strobe
  else if (ct >= SPIN[1] && ct < 1) {                                    // settled: each face glows once in turn, and fades
    const step = (ct - SPIN[1]) / (1 - SPIN[1]) * 4, k = Math.floor(step) % 4, fade = 1 - (step - Math.floor(step));
    scene.background.lerp(col.setHex(FACE_COLORS[k]), 0.15 * fade);
    faceLines[k].material.opacity = Math.max(faceLines[k].material.opacity, 0.15 + 0.5 * fade);
  }
  drawNet();
  drawHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

resize();
reset();
requestAnimationFrame(frame);
window.__booted = true;
document.getElementById('bootfail')?.remove();   // a slow load can finish after the 8 s message
// test hook, local dev only
if (['127.0.0.1', 'localhost'].includes(location.hostname))
  window.__tc = { get grid() { return grid; }, get actives() { return actives; }, get active() { return active; }, ringCol, clearRows, W, H, S, RING,
    get streak() { return [...streak]; }, get cubes() { return cubes; }, get score() { return score; }, get lines() { return lines; },
    get paused() { return paused; }, get over() { return over; }, get armed() { return armed; }, get menu() { return menu; },
    get audio() { return sfx.probe(); },
    get nav() { const it = navItems(); return { screen: scr(), idx: navIdx(it), items: it.map(e => e.textContent.trim().slice(0, 18)), focused: it[navIdx(it)]?.textContent.trim().slice(0, 18) ?? null, cursorOn: it.findIndex(e => e.classList.contains('focus')) }; },
    // fill the empty cells of face f's bottom n rows and clear: rows(f, 4) is a TETRA on f, rows(f, 1..3) breaks the streak
    rows(f, n) { for (let r = 0; r < n; r++) for (let j = 0; j < W; j++) grid[ringCol(f, j)][r] ??= 'I'; clearRows(); return [...streak]; },
    tetra(f) { return this.rows(f, 4); } };
</script>
