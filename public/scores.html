<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tetracube · High Scores</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="Live high scores for Tetracube, the falling-block puzzle on four faces of a cube: the Focus and Live boards, updated every few seconds.">
<link rel="canonical" href="https://tetracube.fun/scores">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Tetracube">
<meta property="og:url" content="https://tetracube.fun/scores">
<meta property="og:title" content="Tetracube · High Scores">
<meta property="og:description" content="The live Focus and Live boards for Tetracube, a falling-block puzzle on four faces of a cube.">
<meta property="og:image" content="https://tetracube.fun/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A pixel-art cube in yellow, cyan and pink beside the word TETRACUBE">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Tetracube · High Scores">
<meta name="twitter:description" content="The live Focus and Live boards for Tetracube, a falling-block puzzle on four faces of a cube.">
<meta name="twitter:image" content="https://tetracube.fun/og.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f4f4f4; --dim: #8a8fa3; }
  html, body { margin: 0; min-height: 100%; background: #07080d; color: var(--ink);
    font: 10px/1.6 "Press Start 2P", ui-monospace, monospace; -webkit-font-smoothing: none; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px); }
  main { max-width: 860px; margin: 0 auto; padding: 28px 14px 40px; text-align: center; }
  h1 { font-size: 34px; font-weight: normal; letter-spacing: 4px; margin: 0 0 10px; }
  h1 span { text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .sub { color: var(--dim); margin-bottom: 26px; }
  .dot { color: #ff4d6d; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .boards { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }
  .panel { position: relative; background: #000; border: 3px solid var(--ink); box-shadow: 0 0 0 3px #000, 0 0 0 6px #3b3f55;
    padding: 18px 12px 12px; min-width: 300px; }
  .panel > .t { position: absolute; top: -9px; left: 10px; padding: 0 6px; background: #000; }
  table { border-collapse: collapse; margin: 0 auto; }
  td { padding: 5px 10px; text-align: right; white-space: nowrap; }   /* a 10-character name stays on its row */
  td:nth-child(2) { text-align: left; }
  tr.h td { color: var(--dim); font-size: 8px; }
  tr.first td { color: #ffd60a; }
  tr.new td { animation: flash 1.2s steps(2, start) 4; }
  @keyframes flash { to { background: #ffd60a; color: #000; } }
  .btn { display: inline-block; margin-top: 30px; color: #38e07b; border: 3px solid #38e07b; padding: 12px 16px 10px;
    text-decoration: none; background: #000; box-shadow: 4px 4px 0 #1d5c37; }
  .btn:hover { background: #38e07b; color: #000; }
  #hof { margin-top: 34px; display: flex; justify-content: center; }
  #hof[hidden] { display: none; }
  #hof .panel { min-width: 300px; }
  @media (prefers-reduced-motion: reduce) { .dot, tr.new td { animation: none; } }
  footer { max-width: 860px; margin: 0 auto; padding: 0 14px 34px; text-align: center; color: var(--dim); font-size: 9px; line-height: 2.4; }
  footer a { color: var(--ink); text-decoration: none; margin: 0 6px; white-space: nowrap; } footer a:hover { color: #ffd60a; }
  @media (max-width: 560px) { h1 { font-size: 22px; } .panel { min-width: 0; width: 100%; box-sizing: border-box; } td { padding: 4px 6px; } }
</style>
<script>/* analytics: only the live site counts. A copy served from any other host (a mirror, localhost, file://) makes no request. */
if (location.hostname === 'tetracube.fun') { const s = document.createElement('script'); s.dataset.goatcounter = 'https://tetracube.goatcounter.com/count'; s.async = true; s.src = '//gc.zgo.at/count.js'; document.head.appendChild(s); }</script>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="sub"><span class="dot">&#9679;</span> LIVE &nbsp; <span id="upd">LOADING…</span></div>
  <div class="boards">
    <div class="panel"><span class="t" style="color:#38e07b">FOCUS</span><div id="focus"></div></div>
    <div class="panel"><span class="t" style="color:#ff4d6d">LIVE</span><div id="live"></div></div>
  </div>
  <div id="hof" hidden><div class="panel"><span class="t" id="hof-t"></span><div id="hof-list"></div></div></div>
  <a class="btn" href="/">PLAY &#9654;</a>
</main>
<footer>
  <a href="/about">ABOUT TETRACUBE</a><br>
  MORE BY HONEYSPOONS<br>
  <a href="https://kuramoto.dev">KURAMOTO.DEV</a> &middot; <a href="https://changelog.systems">CHANGELOG</a> &middot; <a href="https://github.com/HoneySpoons">GITHUB</a> &middot; <a href="https://buymeacoffee.com/HoneySpoons">BUY ME A COFFEE &#9749;</a>
</footer>
<script>
const COLORS = ['#00d8ff', '#ffd60a', '#b15cff', '#38e07b', '#ff4d6d', '#3a86ff', '#ff9f1c'];
document.getElementById('title').innerHTML = [...'TETRACUBE'].map((c, i) => `<span style="color:${COLORS[i % 7]}">${c}</span>`).join('');
const pad = (n, w) => String(n).padStart(w, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const seen = { focus: null, live: null };
const N = 25;

function table(mode, list) {
  const known = seen[mode];
  const key = s => `${s.initials}|${s.score}|${s.created_at}`;
  const rows = Array.from({ length: N }, (_, i) => {
    const s = list[i];
    const cls = !s ? '' : i === 0 ? 'first' : '';
    const fresh = s && known && !known.has(key(s)) ? ' new' : '';
    return `<tr class="${cls}${fresh}"><td>${pad(i + 1, 2)}</td><td>${s ? esc(s.initials) : '---'}</td>` +
      `<td>${s ? pad(Number(s.score) | 0, 6) : '------'}</td><td>${s ? pad(Number(s.lines) | 0, 3) : '---'}</td><td>${s ? pad(Number(s.level) | 0, 2) : '--'}</td></tr>`;
  }).join('');
  seen[mode] = new Set(list.map(key));
  return `<table><tr class="h"><td>NO</td><td>NAME</td><td>SCORE</td><td>LINES</td><td>LV</td></tr>${rows}</table>`;
}

async function refresh() {
  try {
    const [f, l] = await Promise.all(['focus', 'live'].map(m =>
      fetch(`/api/scores?mode=${m}&limit=${N}`).then(r => r.ok ? r.json() : Promise.reject(r.status))));
    document.getElementById('focus').innerHTML = table('focus', f.scores);
    document.getElementById('live').innerHTML = table('live', l.scores);
    document.getElementById('upd').textContent = 'UPDATED ' + new Date().toLocaleTimeString([], { hour12: false });
  } catch {
    document.getElementById('upd').textContent = 'SCOREBOARD OFFLINE — RETRYING';
  }
}
// The hall of fame: everyone who has built a TETRACUBE, in the order they did it. Shown only once it has
// someone in it; until then this page doesn't mention it.
document.getElementById('hof-t').innerHTML = [...'TETRACUBE'].map((c, i) => `<span style="color:${COLORS[i % 7]}">${c}</span>`).join('');
async function refreshHof() {
  try {
    const r = await fetch('/api/cube');
    if (!r.ok) return;
    const { entries } = await r.json();
    if (!entries.length) return;
    document.getElementById('hof-list').innerHTML = `<table><tr class="h"><td>NO</td><td>NAME</td><td>DATE</td></tr>` +
      entries.map((e, i) => `<tr${i === 0 ? ' class="first"' : ''}><td>${pad(i + 1, 2)}</td><td>${esc(e.initials)}</td><td>${esc(String(e.created_at).slice(0, 10))}</td></tr>`).join('') +
      `</table>`;
    document.getElementById('hof').hidden = false;
  } catch {}
}
refresh(); refreshHof();
setInterval(() => { if (!document.hidden) refreshHof(); }, 30000);
setInterval(() => { if (!document.hidden) refresh(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
